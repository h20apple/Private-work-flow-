<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dispatch Paperwork Hub</title><style>
:root{font-family:Arial,sans-serif;color:#172c28;background:#eaf0ed}*{box-sizing:border-box}body{margin:0}header{background:#173f35;color:white;padding:15px;position:sticky;top:0;z-index:3}header h1{font-size:19px;margin:0 0 5px}header small{opacity:.85}main{padding:12px;max-width:1550px;margin:auto}.toolbar,.panel{background:white;border-radius:12px;padding:13px;margin-bottom:12px;box-shadow:0 2px 10px #0001}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}button,select,input,textarea{font:inherit}button{background:#176c50;color:white;border:0;border-radius:7px;padding:10px 13px;cursor:pointer}button.secondary{background:#e0e9e5;color:#173f35}button:disabled{opacity:.4}input,select,textarea{border:1px solid #bacbc5;border-radius:5px;padding:7px;width:100%;background:white}label{display:block;font-size:12px;font-weight:bold;margin-bottom:5px}.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.muted{color:#52635e;font-size:13px}.tabs{display:flex;gap:8px;overflow-x:auto;margin:10px 0;padding:9px;background:white;border-radius:12px;position:sticky;top:66px;z-index:4;box-shadow:0 2px 8px #0002;scrollbar-width:thin}.tabs button{white-space:nowrap;background:#dbe7e2;color:#153e33;font-weight:700;min-height:44px;border:2px solid transparent}.tabs button.active{background:#176c50;color:white;border-color:#104a37}.paper{background:white;padding:13px;border:1px solid #52635e;min-width:1200px;color:black}.scroll{overflow:auto;border:1px solid #cad8d1;border-radius:8px}.paper h2{text-align:center;font-size:16px;margin:5px}.paper .top{display:flex;justify-content:space-between;align-items:center;border:1px solid #555;padding:8px}.paper .top strong{font-size:19px}.paper table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:10px}.paper th,.paper td{border:1px solid #555;padding:2px;text-align:center;vertical-align:middle;overflow-wrap:anywhere}.paper th{background:#e1e1e1;height:90px;font-size:9px}.paper td input,.paper td select{padding:4px 2px;border:0;min-width:0;width:100%;font-size:11px;background:transparent}.paper td input:focus,.paper td select:focus{outline:2px solid #176c50}.paper td{height:35px}.paper .check{background:#e9e9e9}.note{font-size:11px;line-height:1.45}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.status{padding:5px 8px;border-radius:6px;background:#dceee4;font-size:12px}.error{color:#a02a23}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.card{border:1px solid #d6e3de;border-radius:8px;padding:12px}.card h3{margin:0 0 6px}.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hidden{display:none!important}@media(max-width:700px){.sign{grid-template-columns:1fr}.paper{min-width:1300px}header{position:static}.tabs{top:0}}@media print{header,.toolbar,.tabs,.actions,.noprint,.panel:not(.printable){display:none!important}body,main{background:white;padding:0}.panel.printable{box-shadow:none;margin:0;padding:0}.scroll{overflow:visible;border:0}.paper{min-width:0;padding:0;border:0}.paper table{font-size:7px}.paper th{font-size:6px;height:58px}.paper td input,.paper td select{font-size:7px;padding:0}.paper td{height:23px}input,textarea,select{border:0!important}@page{size:A4 landscape;margin:6mm}}

/* A4 landscape print layout: keep all 23 verification columns inside 285mm. */
@media print {
 @page { size:A4 landscape; margin:6mm; }
 html,body,main,#view,.panel.printable,.scroll,.paper {width:100%!important;max-width:100%!important;min-width:0!important;margin:0!important;padding:0!important;overflow:visible!important;box-shadow:none!important;}
 body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
 .paper{font-family:Arial,sans-serif;}
 .paper .top{padding:2mm!important;min-height:12mm;}
 .paper .top strong{font-size:11pt!important;}
 .paper h2{font-size:10pt!important;margin:1mm!important;}
 .paper .meta{display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr))!important;gap:1.5mm!important;padding:2mm 0!important;}
 .paper label{font-size:6.5pt!important;margin:0!important;}
 .paper .meta input,.paper>div>input{font-size:7pt!important;padding:1mm!important;}

 .paper td input,.paper td select{font-size:6pt!important;line-height:1!important;padding:0!important;min-width:0!important;width:100%!important;text-align:center!important;color:black!important;opacity:1!important;}
 .paper input:disabled,.paper select:disabled{color:black!important;-webkit-text-fill-color:black!important;opacity:1!important;}
 .paper .sign{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:1mm!important;margin-top:2mm!important;}
 .paper textarea{font-size:7pt!important;min-height:7mm!important;}
 .paper thead{display:table-header-group;}
 .paper tr{break-inside:avoid;page-break-inside:avoid;}
 .paper .top,.paper .meta,.paper .sign{break-inside:avoid;}
 .paper .actions,.paper .noprint{display:none!important;}
 .sic-print{width:100%!important;max-width:100%!important;}
 .sic-print .scroll{overflow:visible!important;}
 .sic-print table{min-width:0!important;width:100%!important;table-layout:fixed!important;font-size:7pt!important;}
 .sic-print th,.sic-print td{padding:1mm!important;overflow-wrap:anywhere!important;}

 .sic-print .muted{display:none!important;}
}
</style></head><body><header><h1>Dispatch Paperwork Hub <small>v0.5 Test</small></h1><small>Bo'ness · CCP9 · Local HTML prototype (no Firebase)</small></header><main><div class="toolbar"><label style="margin:0">Test account <select id="role" style="width:auto"><option>Operator</option><option>Supervisor</option><option>Charge Hand</option><option>Manager</option><option>Technical</option></select></label><span id="save" class="status">Saved locally</span><button class="secondary" onclick="exportData()">Backup JSON</button><button class="secondary" onclick="document.getElementById('importFile').click()">Restore</button><input class="hidden" type="file" id="importFile" accept=".json"></div><nav class="tabs" id="tabs"></nav><div id="view"></div></main><script>
const KEY='dispatch_hub_full_paper_v02';const cols=[['line','Line Check / Channel Initial'],['r','R Code'],['depot','Depot Start Reference (Time)'],['visual','Visual Check on first 5 packs'],['useby','Use By (DD/MM/YYYY)'],['print','Print Quality ✓/✗'],['trayUPC','UPC on Tray End'],['labelUPC','UPC on Label'],['match','Do the UPCs match ✓/✗'],['reads','No. of Reads used'],['readchange','Read Change Check ✓/✗'],['labelcheck','Label / sleeve / start, every 30 min, every hour, end of run ✓/✗'],['initials','Operator Initials'],['check','C/Hand Check'],['waste','Total no. Waste Sleeves'],['trays','Total Trays – Labelled Packs'],['unlabelled','Unlabelled Packs'],['over','Over Packs'],['burst','Burst Packs'],['reject','Reject Packs'],['floor','Floor Waste'],['other','Other packs (e.g. samples, set up)'],['start','Packs from Start, Middle, End of run']];
const initial=[['R5538','OC Honey Roast Salmon Pasta Salad (Small)'],['R5483','MS Honey Roast Salmon Pasta Bowl'],['R5537','OC King Prawn Tomato & Basil Pasta Salad (Large)'],['R5482','MS King Prawn Tomato & Basil Pasta Salad (Large)'],['R5746','MS ND Chipotle Peppers & Jalapeno Houmous'],['R5739','MS Honey & Mustard Pasta Salad (Large)'],['R5738','MS Chicken Bacon Sweetcorn Pasta Salad (Large)'],['R5533','MS Chicken Bacon Sweetcorn Pasta Salad (Large)'],['R5485','MS Feta Cheese & Roasted Tomato Pasta Salad (Large)'],['R5539','OC Feta Cheese & Roasted Tomato Pasta Salad (Large)']].map(([r,name])=>({r,name,trayUPC:'',labelUPC:''}));
const newShift=()=>({id:Date.now(),date:new Date().toISOString().slice(0,10),shift:'',line:'',packDate:'',dell:'',sheet:'1',of:'1',reason:'Frequency of retaining samples has changed',rows:Array.from({length:12},()=>({})),sign:{},status:'In Progress',review:'',sic:[],closedAt:null});
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state)state={products:initial,shift:newShift(),archives:[]};let role='Operator',tab='form';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('save').textContent='Saved locally ✓'}catch(e){alert('Storage full. Export a backup.')}}function product(r){return state.products.find(p=>p.r.toUpperCase()===('R'+String(r).replace(/^r/i,'')).toUpperCase())}function allowed(){return role==='Operator'?['form','lookup']:['sic','form','lookup','archive']}function editable(){return ['Operator','Charge Hand'].includes(role)&&!['Approved','Submitted','Closed'].includes(state.shift.status)}function hand(){return role==='Charge Hand'||role==='Supervisor'}function isDateField(path){return path==='shift.packDate'||path==='shift.date'||/\.useby$/.test(path)}function isMarkField(path){return /^row\.\d+\.(line|visual|print|match|readchange|labelcheck|check|start)$/.test(path)}function isNumericField(path){return /^row\.\d+\.(reads|waste|trays|unlabelled|over|burst|reject|floor|other)$/.test(path)||/^sic\.\d+\.(planned|units|trays|waste)$/.test(path)}function ukDate(v){if(!v)return '';if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v.slice(8)+'/'+v.slice(5,7)+'/'+v.slice(0,4);return v}function validUkDate(v){if(!v)return true;const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(v);if(!m)return false;const d=new Date(+m[3],+m[2]-1,+m[1]);return d.getFullYear()===+m[3]&&d.getMonth()===+m[2]-1&&d.getDate()===+m[1]}function input(path,val,type='text',readonly=false){let value=esc(isDateField(path)?ukDate(val):val);if(isMarkField(path)){return `<select data-path="${path}" ${readonly?'disabled':''}><option value=""></option><option value="✓" ${val==='✓'?'selected':''}>✓</option><option value="✗" ${val==='✗'?'selected':''}>✗</option><option value="N/A" ${val==='N/A'?'selected':''}>N/A</option></select>`}if(isDateField(path))return `<input type="text" inputmode="numeric" maxlength="10" placeholder="DD/MM/YYYY" data-ukdate="1" data-path="${path}" value="${value}" ${readonly?'disabled':''}>`;if(isNumericField(path))return `<input type="text" inputmode="numeric" pattern="[0-9]*" data-number="1" data-path="${path}" value="${value}" ${readonly?'disabled':''}>`;return `<input type="text" data-path="${path}" value="${value}" ${readonly?'disabled':''}>`}function meta(name,label){return `<div><label>${label}</label>${input('shift.'+name,state.shift[name],name==='date'?'date':'text',!['Operator','Supervisor','Charge Hand'].includes(role))}</div>`}function render(){const a=allowed();if(!a.includes(tab))tab='form';document.getElementById('tabs').innerHTML=a.map(t=>`<button class="${tab===t?'active':''}" data-tab="${t}">${{form:'Final Product Sheet',sic:'SIC Sheet',lookup:'Product Lookup',archive:'Shift Archive'}[t]}</button>`).join('');document.getElementById('view').innerHTML=({form:renderForm,sic:renderSic,lookup:renderLookup,archive:renderArchive}[tab])();}
function renderForm(){const s=state.shift;return `<div class="panel printable"><div class="scroll"><div class="paper"><div class="top"><div>Bo'ness<br><b>CCP9</b></div><div style="text-align:center">Record for:<h2>Final Product Label Verification Checks (M&amp;S)</h2></div><strong>BAKKAVOR <small>SALADS</small></strong></div><div class="meta" style="padding:8px 0">${meta('packDate','Pack Date')}${meta('dell','Dell')}${meta('line','Line')}${meta('shift','Shift')}${meta('sheet','Sheet')}${meta('of','Of')}</div><div><label>Reason for Issue</label>${input('shift.reason',s.reason,'text',!['Operator','Supervisor','Charge Hand'].includes(role))}</div><div class="note"><b>Autocoding Failsafe Check</b> (start of each shift): <select data-path="shift.failsafe" style="width:100px"><option value=""></option><option ${s.failsafe==='YES'?'selected':''}>YES</option><option ${s.failsafe==='NO'?'selected':''}>NO</option></select> &nbsp; <b>Incorrect barcode LABEL:</b> ACCEPTABLE / UNACCEPTABLE &nbsp; <b>Label Consecutive 'No Reads' – LINE STOPS:</b> YES / NO<br><b>Incorrect barcode SLEEVE:</b> ACCEPTABLE / UNACCEPTABLE / No sleeve printer &nbsp; <b>Sleeve Line Sensor – LINE STOPS:</b> YES / NO / no sleeve printer<br><b>Incorrect barcode BASE LABEL:</b> ACCEPTABLE / UNACCEPTABLE / NA &nbsp; <b>Base Label Consecutive 'No Reads' – LINE STOPS:</b> YES / NO / NA</div><div class="noprint actions"><button onclick="addRow()" ${editable()?'':'disabled'}>+ Add check row</button><span class="muted">Scroll sideways to complete every column. Enter an R-code to fill verified UPCs when available.</span></div><table><colgroup>${cols.map(c=>`<col style="width:${['r','depot','useby','trayUPC','labelUPC'].includes(c[0])?'95':'67'}px">`).join('')}</colgroup><thead><tr>${cols.map(c=>`<th>${esc(c[1])}</th>`).join('')}</tr></thead><tbody>${s.rows.map((r,i)=>`<tr>${cols.map(c=>`<td class="${['line','visual','print','match','readchange','check','other'].includes(c[0])?'check':''}">${input('row.'+i+'.'+c[0],r[c[0]]||'','text',c[0]==='check'? !hand()||['Approved','Closed'].includes(s.status) : !editable())}</td>`).join('')}</tr>`).join('')}</tbody></table><div class="note" style="margin-top:12px"><b>Responsibility</b><br>Line Check – Chargehand to initial to confirm there are no packs, labels or sleeves from the previous run. Operator to complete visual checks, date-code and label checks in accordance with the approved site procedure. Record all checks and stop the line for unacceptable results. Confirm against the current controlled paper procedure before production use.</div><div class="sign" style="margin-top:12px">${[['operator','Responsible Operator (Print Name)'],['operatorSign','Operator Signature / typed acknowledgement'],['chargehand','Chargehand'],['chargehandSign','Chargehand Signature / typed acknowledgement'],['times','Time(s)'],['revision','Revision / reference']].map(([k,l])=>`<div><label>${l}</label>${input('sign.'+k,s.sign[k]||'','text',k.startsWith('chargehand')?!hand():!editable())}</div>`).join('')}</div><div style="margin-top:10px"><label>Additional comments / action taken</label><textarea rows="3" data-path="sign.comments" ${!editable()&&!hand()?'disabled':''}>${esc(s.sign.comments||'')}</textarea></div><p class="note">Section No CCP9 · Final Product Label Verification Checks (M&amp;S) · Paper reference: Revision 23, dated 12/02/2025 (verify against current controlled version)</p></div></div><div class="actions noprint"><span class="status">${esc(s.status)}</span>${['Operator','Charge Hand'].includes(role)?`<button onclick="submitForm()" ${editable()?'':'disabled'}>Submit to Supervisor</button>`:''}${hand()?`<button onclick="review('Approved')" ${s.status!=='Submitted'?'disabled':''}>Approve Sheet</button><button class="secondary" onclick="review('Correction Required')" ${s.status!=='Submitted'?'disabled':''}>Return for Correction</button>`:''}<button class="secondary" onclick="window.print()">Print / Save PDF</button></div>${hand()?`<label>Supervisor review notes</label><textarea data-path="shift.review">${esc(s.review)}</textarea>`:''}</div>`}
function renderSic(){let s=state.shift;return `<div class="panel printable sic-print"><h2>Dispatch SIC Sheet – linked product lookup</h2><p class="muted">Supervisor entry. R-codes share the same product database as the operator sheet. This is a test SIC view, not the full original v10 layout.</p><div class="scroll"><table style="min-width:900px;width:100%;border-collapse:collapse"><thead><tr>${['Start','Finish','R-code','Product','Planned Packs','Units/Tray','Total Trays','Packs Produced','Waste'].map(x=>`<th style="border:1px solid #bbb;padding:8px">${x}</th>`).join('')}</tr></thead><tbody>${s.sic.map((r,i)=>`<tr>${['start','finish','r','name','planned','units','trays','produced','waste'].map(k=>`<td style="border:1px solid #bbb;padding:3px">${k==='name'?esc(product(r.r)?.name||'Unknown product'):k==='produced'?Number(r.units||0)*Number(r.trays||0):input('sic.'+i+'.'+k,r[k]||'','text',!hand())}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${hand()?'<div class="actions"><button onclick="addSic()">+ Add SIC row</button></div>':''}<div class="actions noprint"><button class="secondary" onclick="window.print()">Print SIC / Save PDF (A4)</button></div></div>`}
function renderLookup(){return `<div class="panel"><h2>Shared R-code / UPC product database</h2><p class="muted">The R-code and UPC fields link to both sheets. Only enter confirmed barcode values; unknown values remain blank.</p>${state.products.map((p,i)=>`<div class="card" style="margin-bottom:8px"><b>${esc(p.r)} — ${esc(p.name)}</b><div class="meta"><div><label>UPC on tray end</label>${input('product.'+i+'.trayUPC',p.trayUPC)}</div><div><label>UPC on label</label>${input('product.'+i+'.labelUPC',p.labelUPC)}</div></div></div>`).join('')}<p class="muted">Product management is editable in this local prototype. A real deployment must enforce manager permissions server-side.</p></div>`}
function renderArchive(){return `<div class="panel"><h2>Shift archive</h2><p class="muted">Closing saves a dated copy locally and opens a new blank shift. Download backups to keep copies outside this browser.</p>${hand()?`<button onclick="closeShift()">Close current shift & open next</button>`:''}<h3>Saved shifts</h3>${state.archives.map((a,i)=>`<div class="card"><b>${esc(a.date)} — ${esc(a.shift||'Shift not set')}</b><p>${esc(a.status)} · ${a.rows.length} verification rows · ${a.sic.length} SIC rows</p><button class="secondary" onclick="downloadArchive(${i})">Download archive JSON</button></div>`).join('')||'<p>No archived shifts yet.</p>'}</div>`}
function addRow(){state.shift.rows.push({});save();render()}function addSic(){state.shift.sic.push({});save();render()}function submitForm(){if(!validateDates()){alert('Please correct highlighted UK dates (DD/MM/YYYY).');return}if(!state.shift.rows.some(r=>r.r)){alert('Enter at least one R-code before submitting.');return}state.shift.status='Submitted';save();render()}function review(status){state.shift.status=status;save();render()}function validateDates(){let ok=true;document.querySelectorAll('[data-ukdate]').forEach(el=>{const good=validUkDate(el.value);el.style.outline=good?'':'2px solid #c22';if(!good)ok=false});return ok}function closeShift(){if(state.shift.status!=='Approved'){alert('Supervisor must approve the Final Product Sheet before closing the shift.');return}if(!confirm('Archive this shift and start a fresh blank shift?'))return;let a=structuredClone(state.shift);a.status='Closed';a.closedAt=new Date().toISOString();state.archives.unshift(a);let n=newShift();n.date=state.shift.date;n.line=state.shift.line;state.shift=n;save();render()}
function download(name,data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}function exportData(){download('dispatch-backup.json',state)}function downloadArchive(i){const a=state.archives[i];download('shift-'+a.date+'-'+a.id+'.json',a)}
document.getElementById('role').onchange=e=>{role=e.target.value;tab=role==='Operator'?'form':'sic';render()};document.getElementById('tabs').onclick=e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}};document.getElementById('importFile').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!v.shift||!Array.isArray(v.products))throw Error('Invalid backup');if(confirm('Replace local data with this backup?')){state=v;save();render()}}catch(e){alert('Cannot restore: '+e.message)}};
document.getElementById('view').addEventListener('input',e=>{let path=e.target.dataset.path;if(!path)return;let p=path.split('.'),v=e.target.value;if(e.target.dataset.number){v=v.replace(/[^0-9]/g,'');e.target.value=v}if(e.target.dataset.ukdate){v=v.replace(/[^0-9]/g,'').slice(0,8);v=v.slice(0,2)+(v.length>2?'/'+v.slice(2,4):'')+(v.length>4?'/'+v.slice(4):'');e.target.value=v;e.target.style.outline=validUkDate(v)?'':'2px solid #c22'}if(p[0]==='row'){let row=state.shift.rows[+p[1]];row[p[2]]=v;if(p[2]==='r'){let pr=product(v);if(pr){row.trayUPC=pr.trayUPC||'';row.labelUPC=pr.labelUPC||'';let tr=e.target.closest('tr');tr.querySelector('[data-path$=".trayUPC"]').value=row.trayUPC;tr.querySelector('[data-path$=".labelUPC"]').value=row.labelUPC}}}else if(p[0]==='sic'){state.shift.sic[+p[1]][p[2]]=v}else if(p[0]==='product'){state.products[+p[1]][p[2]]=v}else if(p[0]==='sign'){state.shift.sign[p[1]]=v}else if(p[0]==='shift'){state.shift[p[1]]=v}save()});render();
</script></body></html>
